name: is_unix_socket_user_check
description: >-
  Decides whether the user on the other end of a Unix-domain socket may connect,
  from the kernel's peer credentials. A peer whose user cannot be read is
  denied, and the overflow uid can never be in an allow list.
version: 0.1.0
repository: https://github.com/intersyntactic/unix_socket_user_check

environment:
  sdk: ^3.13.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
